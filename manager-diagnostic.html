<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>
body{font-family:monospace;font-size:12px;background:#0f172a;color:#e2e8f0;padding:14px;margin:0}
h2{color:#38bdf8;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:14px 0 5px}
.row{padding:3px 0;border-bottom:1px solid #1e293b;display:flex;gap:8px;flex-wrap:wrap}
.lbl{color:#64748b;min-width:180px}.val{color:#4ade80;word-break:break-all}.no{color:#f87171}
.box{background:#1e293b;border-radius:5px;padding:8px;margin-top:4px;word-break:break-all;line-height:1.6;font-size:11px;color:#94a3b8;min-height:28px}
.ok{border-left:3px solid #4ade80;color:#4ade80!important}
button{margin:3px;padding:6px 10px;background:#1d4ed8;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px}
pre{white-space:pre-wrap;margin:0}
</style></head>
<body>
<h2>Context</h2>
<div class="row"><span class="lbl">In iframe</span><span class="val" id="v1"></span></div>
<div class="row"><span class="lbl">document.referrer</span><span class="val" id="v2"></span></div>

<h2>Received Messages — <span id="cnt" style="color:#fbbf24">0</span></h2>
<div class="box" id="msgs">Waiting…</div>

<h2>Send postMessage to parent (try each)</h2>
<button onclick="send({type:'requestContext'})">requestContext</button>
<button onclick="send({type:'manager-extension-ready'})">extension-ready</button>
<button onclick="send({type:'ready'})">ready</button>
<button onclick="send({type:'init'})">init</button>
<button onclick="send({type:'connect'})">connect</button>
<button onclick="send({type:'fetch',path:'sales-invoice-batch',method:'GET'})">fetch sales</button>
<button onclick="send({action:'getData',resource:'sales-invoice-batch'})">getData</button>
<button onclick="send({type:'api',endpoint:'sales-invoice-batch'})">api endpoint</button>
<button onclick="send('ready')">string ready</button>
<button onclick="send({type:'request',url:'sales-invoice-batch?PageSize=1'})">request url</button>
<div class="box" id="sent">Nothing sent yet</div>

<h2>All globals added by Manager.io</h2>
<div class="box" id="globals">Scanning…</div>

<script>
document.getElementById('v1').textContent = String(window.self !== window.top);
document.getElementById('v2').textContent = document.referrer || '(empty)';

var BASE = Object.keys(window);
var n = 0;

window.addEventListener('message', function(e) {
  n++;
  document.getElementById('cnt').textContent = n;
  var b = document.getElementById('msgs'); b.className = 'box ok';
  var r=''; try{r=JSON.stringify(e.data,null,2);}catch(x){r=String(e.data);}
  b.innerHTML = '<b style="color:#38bdf8">['+new Date().toISOString().slice(11,23)+'] Origin: '+(e.origin||'?')+'</b><br><pre>'+r.slice(0,1000)+'</pre>';
});

function send(msg) {
  try {
    window.parent.postMessage(msg, '*');
    document.getElementById('sent').className = 'box ok';
    document.getElementById('sent').textContent = 'Sent: ' + JSON.stringify(msg);
  } catch(e) {
    document.getElementById('sent').textContent = 'Error: '+e;
  }
}

// Auto-send all formats on load
var formats = [
  {type:'requestContext'},
  {type:'manager-extension-ready'},
  {type:'ready'},
  {type:'init'},
  {type:'ping'},
  'ready'
];
var fi = 0;
function autoSend() {
  if (fi < formats.length) {
    try { window.parent.postMessage(formats[fi], '*'); } catch(e){}
    fi++;
    setTimeout(autoSend, 600);
  }
}
autoSend();

// Scan globals every 300ms
setInterval(function() {
  var added = Object.keys(window).filter(function(k){return BASE.indexOf(k)===-1;});
  var el = document.getElementById('globals');
  if (!added.length) { el.textContent = '(none yet)'; }
  else { el.className='box ok'; el.innerHTML = added.map(function(k){ return k+': '+JSON.stringify(window[k]).slice(0,80); }).join('\n'); }
}, 300);
</script>
</body></html>
