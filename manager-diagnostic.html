<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>
body{font-family:monospace;font-size:13px;background:#0f172a;color:#e2e8f0;padding:16px}
h2{color:#38bdf8;font-size:12px;text-transform:uppercase;margin:14px 0 6px}
.row{padding:4px 0;border-bottom:1px solid #1e293b;display:flex;gap:12px}
.lbl{color:#64748b;min-width:200px}.val{color:#4ade80;word-break:break-all}
.no{color:#f87171}
#mb{background:#1e293b;border-radius:6px;padding:10px;margin-top:6px;
    min-height:40px;word-break:break-all;line-height:1.6;color:#94a3b8}
.got{color:#4ade80!important;border-left:3px solid #4ade80}
button{margin-top:10px;padding:8px 16px;background:#1d4ed8;color:#fff;
       border:none;border-radius:6px;cursor:pointer;font-size:12px}
#fr{margin-top:8px;padding:8px;background:#1e293b;border-radius:6px;
    font-size:11px;word-break:break-all;line-height:1.6;color:#64748b}
</style></head>
<body>
<h2>Window Context</h2>
<div class="row"><span class="lbl">window.self === window.top</span><span class="val" id="vt"></span></div>
<div class="row"><span class="lbl">window.parent === window.top</span><span class="val" id="vpt"></span></div>
<div class="row"><span class="lbl">window.opener exists</span><span class="val" id="vo"></span></div>
<div class="row"><span class="lbl">document.referrer</span><span class="val" id="vr"></span></div>
<div class="row"><span class="lbl">window.name</span><span class="val" id="vn"></span></div>
<div class="row"><span class="lbl">URL params</span><span class="val" id="vp"></span></div>

<h2>postMessages — <span id="cnt" style="color:#fbbf24">0 received</span></h2>
<div id="mb">Waiting… (pure listener, NO ready signal sent)</div>

<h2>Session-Cookie Fetch Test</h2>
<button onclick="tryFetch()">Fetch Manager.io API with session cookies</button>
<div id="fr">Click to try</div>

<script>
document.getElementById('vt').textContent  = String(window.self === window.top);
document.getElementById('vpt').textContent = String(window.parent === window.top);
document.getElementById('vo').textContent  = String(!!window.opener);
document.getElementById('vr').textContent  = document.referrer || '(empty)';
document.getElementById('vn').textContent  = window.name || '(empty)';
document.getElementById('vp').textContent  = window.location.search || '(none)';
['vt','vpt','vo'].forEach(function(id) {
  if (document.getElementById(id).textContent === 'false')
    document.getElementById(id).className = 'val no';
});

var n = 0;
window.addEventListener('message', function(e) {
  n++;
  document.getElementById('cnt').textContent = n + ' received';
  var b = document.getElementById('mb');
  b.className = 'got';
  var r = '';
  try { r = JSON.stringify(e.data, null, 2); } catch(x) { r = String(e.data); }
  b.innerHTML = '<b style="color:#38bdf8">Origin:</b> ' + (e.origin||'?') +
    '<br><b style="color:#38bdf8">Data:</b><br><pre style="white-space:pre-wrap">' +
    r.slice(0,1000) + '</pre>';
});

function tryFetch() {
  var el = document.getElementById('fr');
  el.style.color = '#fbbf24'; el.textContent = 'Fetching…';
  var m = (document.referrer||'').match(/^(https?:\/\/[^\/]+)/);
  var url = (m ? m[1] : 'https://mnzrventures.manager.io') + '/api2/';
  fetch(url, { credentials: 'include', headers: { 'Accept': 'application/json' } })
    .then(function(r) {
      el.style.color = r.ok ? '#4ade80' : '#f87171';
      return r.text().then(function(t) {
        el.textContent = 'HTTP ' + r.status + ' — ' + url + '\n\n' + t.slice(0,500);
      });
    })
    .catch(function(err) {
      el.style.color = '#f87171';
      el.textContent = 'FAILED: ' + String(err) + '\nURL: ' + url;
    });
}
</script>
</body></html>
